<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero A — קרוב לפלייר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;800;900&family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { font-family:'Assistant',sans-serif; background:#F8F4ED; color:#0E2A47; min-height:100vh; }

  .stage { min-height:100vh; padding:24px; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#E8F4FA 0%,#F8F4ED 100%); }
  .card { width:min(1100px,100%); background:#fff; border-radius:32px; overflow:hidden; box-shadow:0 30px 80px rgba(14,42,71,0.18); position:relative; }

  .hero { position:relative; min-height:680px; background:url('/images/sketch-hero-photo.svg') center/cover; }
  .hero::before { content:''; position:absolute; inset:0; background:radial-gradient(circle at 50% 25%, rgba(255,255,255,0.55), rgba(255,255,255,0.1) 60%, rgba(255,255,255,0) 80%); }

  .leaves { position:absolute; pointer-events:none; opacity:0.7; }
  .leaves.l { top:-20px; right:-30px; width:240px; transform:rotate(-15deg); }
  .leaves.r { top:-20px; left:-30px; width:240px; transform:rotate(20deg) scaleX(-1); }

  .content { position:relative; padding:48px 32px 80px; text-align:center; }
  .logo-row { display:flex; flex-direction:column; align-items:center; gap:4px; margin-bottom:18px; }
  .logo { width:74px; height:74px; border-radius:50%; background:linear-gradient(135deg,#4FC3E8,#4CB050); display:flex; align-items:center; justify-content:center; font-family:'Heebo'; font-weight:900; color:#fff; font-size:28px; box-shadow:0 8px 24px rgba(79,195,232,0.4); }
  .brand { font-family:'Heebo'; font-weight:900; font-size:18px; color:#0E2A47; }
  .brand small { display:block; font-size:13px; font-weight:700; color:#446B91; margin-top:2px; }

  h1 { font-family:'Heebo'; font-weight:900; line-height:0.92; letter-spacing:-1px; margin:14px 0 22px; }
  .h-top { font-size:clamp(38px,7vw,72px); color:#0E2A47; }
  .h-yellow { display:inline-block; font-size:clamp(72px,15vw,160px); color:#FFC72C; text-shadow:4px 4px 0 #fff, 8px 8px 0 rgba(14,42,71,0.06); transform:rotate(-2deg); padding:0 10px; }
  .h-bottom { font-size:clamp(34px,6.5vw,60px); color:#0E2A47; }

  .splash { display:inline-block; vertical-align:middle; }
  .splash svg { width:36px; height:36px; }

  .badge-row { display:flex; flex-direction:column; gap:14px; align-items:center; margin-top:24px; }
  .badge-navy { display:inline-flex; align-items:center; gap:14px; background:#0E2A47; color:#fff; font-family:'Heebo'; font-weight:800; font-size:clamp(18px,3vw,24px); padding:18px 32px; border-radius:18px; box-shadow:0 12px 30px rgba(14,42,71,0.25); }
  .badge-navy .pill { background:#FFC72C; color:#0E2A47; padding:6px 14px; border-radius:10px; font-size:0.85em; font-weight:900; }
  .badge-navy .ico { display:inline-flex; width:34px; height:34px; align-items:center; justify-content:center; color:#FFC72C; }

  .ribbon { position:absolute; top:30px; right:30px; background:#0E2A47; color:#fff; padding:14px 16px; border-radius:50%; font-family:'Heebo'; font-weight:900; font-size:15px; line-height:1.1; text-align:center; width:96px; height:96px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 8px 22px rgba(14,42,71,0.3); transform:rotate(-8deg); }
  .ribbon small { font-size:11px; font-weight:700; opacity:0.85; }

  .cta-wrap { margin-top:34px; }
  .cta { display:inline-flex; align-items:center; gap:10px; background:linear-gradient(180deg,#FFC72C,#F5A623); color:#0E2A47; font-family:'Heebo'; font-weight:900; font-size:22px; padding:20px 44px; border-radius:18px; border:none; cursor:pointer; box-shadow:0 14px 32px rgba(245,166,35,0.4); position:relative; transition:transform 0.2s ease; text-decoration:none; }
  .cta:hover { transform:translateY(-2px); }
  .cta-sub { display:block; margin-top:14px; color:#0E2A47; font-weight:700; font-size:15px; opacity:0.7; }

  .water-drops { position:absolute; pointer-events:none; }
  .water-drops.l1 { top:140px; right:80px; font-size:28px; }
  .water-drops.l2 { top:180px; right:140px; font-size:18px; }
  .water-drops.r1 { top:140px; left:80px; font-size:28px; }
  .water-drops.r2 { top:180px; left:140px; font-size:18px; }

  .label { position:absolute; bottom:16px; right:16px; font-size:11px; color:#0E2A47; opacity:0.5; font-family:'Heebo'; font-weight:700; letter-spacing:1px; }
</style>
</head>
<body>
<div class="stage">
  <div class="card">
    <div class="hero">
      <svg class="leaves l" viewBox="0 0 200 200"><path d="M100 10 Q40 80 30 180 Q90 130 160 180 Q150 80 100 10 Z" fill="#4CB050" opacity="0.7"/></svg>
      <svg class="leaves r" viewBox="0 0 200 200"><path d="M100 10 Q40 80 30 180 Q90 130 160 180 Q150 80 100 10 Z" fill="#4CB050" opacity="0.7"/></svg>

      <div class="ribbon">המנוי כולל<br><small>שבת</small></div>

      <div class="water-drops l1">💧</div>
      <div class="water-drops l2">💧</div>
      <div class="water-drops r1">💧</div>
      <div class="water-drops r2">💧</div>

      <div class="content">
        <div class="logo-row">
          <div class="logo">CKH</div>
          <div class="brand">קאנטרי קריית השרון <small>מועדון הספורט של השכונה</small></div>
        </div>

        <h1>
          <span class="h-top">יריד</span><br>
          <span class="h-yellow">המכירות</span><br>
          <span class="h-bottom">של הקיץ</span>
        </h1>

        <div class="badge-row">
          <div class="badge-navy">
            הרשמה מוקדמת למנוי קיץ: <span class="pill">לפני עליית המחירים</span>
          </div>
          <div class="badge-navy">
            <span class="ico">📅</span>
            יום חמישי, 28 למאי
          </div>
        </div>

        <div class="cta-wrap">
          <a class="cta" href="#">השאירו פרטים עכשיו →</a>
          <span class="cta-sub">פחות מ-60 שניות · 80 מקומות בלבד</span>
        </div>
      </div>
    </div>
    <div class="label">SKETCH A — CLOSE TO FLYER</div>
  </div>
</div>
</body>
</html>
